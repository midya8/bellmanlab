name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m bellmanlab demo > /tmp/demo.json
      - run: python -m bellmanlab policy examples/delayed.json
      - run: python -m bellmanlab evaluate examples/delayed.json --policy '[0,0,0]'
      - run: python -m bellmanlab audit examples/residual.json --values '[0]'
      - run: python -m bellmanlab value examples/residual.json --sweeps 256 --tolerance '[1,10]' > /tmp/value.json
      - run: PYTHONPATH=. python examples/render_audit.py --check
      - run: python -m bellmanlab robust-demo > /tmp/robust-demo.json
      - run: python -m bellmanlab robust-audit examples/robust.json --values '[0]'
      - run: python -m bellmanlab robust-value examples/robust.json --sweeps 32 --tolerance '[1,1000000]' > /tmp/robust-value.json
      - run: python -m bellmanlab robust-value examples/robust.json --policy '[0]' > /tmp/robust-policy.json
      - run: PYTHONPATH=. python examples/render_robust.py --check
      - run: python -m bellmanlab robust-policy-demo > /tmp/robust-policy-demo.json
      - run: python -m bellmanlab robust-evaluate examples/robust.json --policy '[0]'
      - run: python -m bellmanlab robust-policy examples/robust.json
      - run: python -m bellmanlab robust-policy examples/robust.json --nature-iterations 1
      - run: PYTHONPATH=. python examples/render_robust_policy.py --check

  occupancy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install wheel scipy==1.15.3
      - run: python tools/check_occupancy_installed.py
      - run: python tools/check_occupancy_reference.py
      - run: node --test tests/test_occupancy_engine.cjs tests/test_occupancy_browser.cjs

  coupled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install wheel scipy==1.15.3
      - run: python tools/check_coupled_installed.py
      - run: python tools/check_coupled_reference.py
      - run: node --test tests/test_coupled_engine.cjs tests/test_coupled_browser.cjs
